# Site configuration.
#
# Shared details live at the top. One table per language follows: English is
# served from the site root, Chinese from /zh/. Edit copy here, not in build.py.
# URLs inside copy are written without a language prefix and get one added.

url = "https://explosion-awas.github.io"
github = "Explosion-Awas"
email = ""
start_year = 2026
default_lang = "en"
languages = ["en", "zh"]
license_prose = "CC BY 4.0"
license_code = "MIT"
author = "Explosion Awas"

