name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --quiet markdown pygments
      - name: Build and check internal links
        run: python build.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the live site and check every section
        run: |
          set -u
          base=https://explosion-awas.github.io
          paths="/ /writing/ /projects/ /papers/ /about/ /feed.xml /search/ /404.html /og.png /favicon.svg /zh/ /zh/writing/ /zh/about/ /zh/feed.xml"
          for attempt in $(seq 1 24); do
            ok=1
            for path in $paths; do
              code=$(curl -sL -o /tmp/body -w '%{http_code}' "$base$path" || true)
              if [ "$code" != "200" ]; then
                echo "attempt $attempt: $path → HTTP $code (not ready)"
                ok=0
                break
              fi
            done
            if [ "$ok" = "1" ] && curl -sL "$base/" | grep -q '<title>Explosion Awas</title>'; then
              page=$(curl -sL "$base/")
              case "$page" in
                *'class="console"'*) ;;
                *) echo "homepage is missing the workshop console"; exit 1 ;;
              esac
              case "$page" in
                *'href="/zh/"'*) ;;
                *) echo "homepage has no language switch"; exit 1 ;;
              esac
              zh=$(curl -sL "$base/zh/")
              case "$zh" in
                *'<html lang="zh-CN"'*) ;;
                *) echo "Chinese homepage is not marked up as zh-CN"; exit 1 ;;
              esac
              echo "live site OK · checked: $paths"
              echo "$page" | grep -o '<title>[^<]*</title>'
              exit 0
            fi
            sleep 10
          done
          echo "live site did not serve every expected page"
          exit 1
