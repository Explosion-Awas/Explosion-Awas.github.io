name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --quiet markdown pygments
      - name: Build and check internal links
        run: python build.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the live site and check the response
        run: |
          set -u
          for attempt in $(seq 1 24); do
            code=$(curl -sL -o /tmp/index.html -w '%{http_code}' https://explosion-awas.github.io/ || true)
            echo "attempt $attempt → HTTP $code"
            if [ "$code" = "200" ] && grep -q '<title>Explosion Awas</title>' /tmp/index.html; then
              echo "live site OK ($(wc -c < /tmp/index.html) bytes)"
              grep -o '<title>[^<]*</title>' /tmp/index.html
              exit 0
            fi
            sleep 10
          done
          echo "live site did not serve the expected page"
          exit 1
